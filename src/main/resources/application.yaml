server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  application:
    name: fineract-hook
  profiles:
    active: ${PROFILE:local}
  kafka:

fineract:
  tenantId: ${FINERACT_TENANT:tn}
  kafka:
    bootstrap-servers: ${BROKER_SERVER:}
    client-id: fineract-hook-api
    topic:
      transaction: ${BROKER_TOPIC_TRANSACTIONS:transactions}
      notification-transaction: ${BROKER_TOPIC_NOTIFICATION_TRANSACTION:notification.transaction}
      notification-payment-confirmation: ${BROKER_TOPIC_NOTIFICATION_PAYMENT_CONFIRMATION:notification.payment-confirmation}
      notification-account: ${BROKER_TOPIC_NOTIFICATION_ACCOUNT:notification.account}
      notification-card: ${BROKER_TOPIC_NOTIFICATION_CARD:notification.card}